name: ps51
# The PowerShell tests on Windows PowerShell 5.1 (powershell.exe), the version on the gov computers (the Administrator, 2026-11-20:
# DoD/M365 code gets the higher level of checks). PnP and the tenant are not on the runner: the tests use fake PnP cmdlets.
# Pull requests that change PowerShell code or its tests, and manual runs; never on push (Actions minutes).
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'PSScriptAnalyzerSettings.psd1'
      - '.github/workflows/ps51.yml'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ps51:
    if: github.event_name != 'pull_request' || github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check Windows PowerShell 5.1 version
        run: |
          $PSVersionTable.PSVersion
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)" }
      - name: Run tests on Windows PowerShell 5.1
        shell: cmd
        run: |
          powershell.exe -NoProfile -Command "& { Set-StrictMode -Version 2.0; & '.\tests\Run-Tests.ps1' }"
